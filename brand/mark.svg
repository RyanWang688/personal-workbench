<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="方寸">
  <style>
    .ink { fill: #1d1e20; }
    .cun { fill: #f2643b; }
    @media (prefers-color-scheme: dark) { .ink { fill: #ececef; } }
  </style>
  <!-- 方：缺了右上角的方块 -->
  <path class="ink" d="M10 18a6 6 0 0 1 6-6h18v18h18v18a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6z"/>
  <!-- 寸：缺掉的那一块，悬在缺口外，正要落回原位 -->
