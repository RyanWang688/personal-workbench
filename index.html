<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>方寸 · 工作台</title>
  <meta name="description" content="方寸 —— 方寸之间，万物归位。看板 + 无限画布 + 功能区的文件工作台：任意文件拖入拖出，智能关联，长按打包归档。">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="brand/mark.svg">
  <link rel="apple-touch-icon" href="brand/fangcun-logo.png">
  <script>
    // 尽早应用主题，避免刷新时闪一下
    try { var t = JSON.parse(localStorage.getItem('wb:theme') || '"auto"'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css?v=69">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" title="方寸 —— 方寸之间，万物归位">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path class="ink" d="M10 18a6 6 0 0 1 6-6h18v18h18v18a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6z"/>
        <rect class="cun" x="38" y="4" width="18" height="18" rx="3.5"/>
      </svg>
      <svg class="wordmark" viewBox="0 0 224 100" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter">
          <path d="M50 4v15"/><path d="M6 27h88"/><path d="M40 27v26c0 22-10 34-30 41"/><path d="M40 53h40v34c0 5-3 8-8 8h-9"/>
          <path d="M124 35h96"/><path d="M190 4v84c0 5-3 8-8 8h-12"/>
        </g>
        <rect class="cun" x="138" y="52" width="20" height="20" rx="4"/>
      </svg>
      <span class="brand-sub">工作台</span>
      <h1 class="sr-only">方寸 · 工作台</h1>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索文件和便签…  Ctrl+K" autocomplete="off" aria-label="搜索">
    </label>
    <div class="actions">
      <button class="btn primary-soft" data-action="add-files" title="上传文件或文件夹（支持批量多文件夹，自动保留子文件夹结构）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg><span>上传</span>
      </button>
      <button class="btn" data-action="new-note" title="新建便签">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg><span>便签</span>
      </button>
      <button class="btn" data-action="backup" title="导出完整备份（含所有文件）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4"/><path d="M5 19h14"/></svg><span>备份</span>
      </button>
      <button class="btn ghost" data-action="restore" title="从备份恢复">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V8m0 0-4 4m4-4 4 4"/><path d="M5 5h14"/></svg><span>恢复</span>
      </button>
      <button class="btn ghost theme-btn" data-action="toggle-theme" id="themeBtn" title="切换白天 / 黑夜（右键：跟随系统）" aria-label="切换白天 / 黑夜模式">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn ghost drafts-toggle" data-action="toggle-drafts" aria-controls="drafts" aria-expanded="false" title="功能区">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/></svg><span>功能区</span><b class="badge" id="zonesBadge">0</b>
      </button>
    </div>
  </header>

  <nav class="viewbar" aria-label="页面">
    <div class="views" id="views" role="tablist"></div>
    <div class="status">
      <button class="assoc-chip icon-chip" data-action="assoc-panel" id="assocChip" aria-label="智能关联" title="智能关联"></button>
      <button class="status-chip icon-chip" data-action="storage-info" id="storageChip" aria-label="存储状态" title="正在检查存储…"></button>
      <button class="status-chip icon-chip" data-action="backup" id="backupChip" aria-label="备份状态" title="尚未备份"></button>
      <button class="status-chip icon-chip sidebar-toggle-chip" data-action="toggle-drafts-rail" id="sidebarToggleChip" aria-label="收起或展开右侧功能区（Ctrl+\）" data-tip="收起 / 展开右侧功能区（Ctrl+\）" title="收起 / 展开右侧功能区（Ctrl+\）"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg></button>
    </div>
  </nav>

  <main class="layout">
    <section class="board" id="board" aria-label="看板"></section>

    <section class="archive-view canvas-directory" id="canvasDirectory" aria-labelledby="canvasDirectoryTitle" hidden></section>

    <section class="canvas-workspace" id="canvasWorkspace" aria-labelledby="canvasTitle" hidden>
      <header class="canvas-workspace-head">
        <button type="button" class="btn" data-view="canvases" aria-label="返回所有画布"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>所有画布</button>
        <h2 id="canvasTitle" tabindex="-1"></h2>
        <div class="collab-head" id="collabHead">
          <div class="collab-avatars" id="collabAvatars" aria-label="在线协作者"></div>
          <button type="button" class="btn collab-btn" id="collabBtn" data-action="collab-panel" aria-expanded="false" aria-controls="collabPopover" title="开启或管理多人实时协作">
            <span class="collab-dot" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M15.5 19a4.5 4.5 0 0 1 5-4.2"/></svg>
            <span id="collabBtnText">多人协作</span>
          </button>
        </div>
        <button type="button" class="btn comment-center-btn" id="commentCenterBtn" data-action="comments-panel" aria-expanded="false" aria-controls="commentsPopover" title="查看画布备注与未读提醒（C 键添加备注）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>
          <span class="comment-btn-label">备注</span>
          <span class="comment-count-pill" id="commentCountPill" hidden>0</span>
          <span class="comment-unread-badge" id="commentUnreadBadge" hidden>0</span>
        </button>
        <button type="button" class="icon-btn canvas-max-btn" data-action="canvas-max" aria-pressed="false" aria-label="最大化工作区（F）" title="最大化工作空间：隐藏顶栏，保留右侧功能区（快捷键 F）"><svg class="ico-max" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><svg class="ico-min" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
        <button type="button" class="icon-btn" data-action="canvas-menu" aria-label="画布设置" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </header>
      <div class="collab-popover" id="collabPopover" role="dialog" aria-label="多人实时协作设置" hidden></div>
      <div class="comments-popover" id="commentsPopover" role="dialog" aria-label="画布备注列表" hidden></div>
      <div class="collab-follow-bar" id="collabFollowBar" hidden></div>
      <div class="canvas-view" id="canvasView">
        <div class="viewport" id="viewport" tabindex="-1">
          <div class="world" id="world"></div>
          <div class="canvas-empty" id="canvasEmpty">
            <b>无限画布</b>
            <span>把文件拖进来，随意摆放 · 按 N 或用左侧工具栏贴便签<br>左侧工具栏画形状、写文字、连箭头 · 左键拖动框选 · 中键拖动平移 · 滚轮缩放</span>
            <button class="btn primary" type="button" data-action="templates">从模板开始：海报 / 网页 / 功能开发…</button>
          </div>
        </div>
        <div class="canvas-palette" id="canvasPalette" role="toolbar" aria-label="白板工具" aria-orientation="vertical">
          <button class="icon-btn on" data-tool="select" data-tip="选择 · 左键框选 / 中键平移" data-key="V" aria-label="选择（V）"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10 19z"/></svg></button>
          <button class="icon-btn" data-tool="sticky" data-tip="便签" data-key="N" aria-label="便签（N）"><svg viewBox="0 0 24 24"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/></svg></button>
          <button class="icon-btn" data-tool="text" data-tip="文字" data-key="T" aria-label="文字（T）"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
          <span class="sep"></span>
          <button class="icon-btn" data-tool="rect" data-tip="矩形" data-key="R" aria-label="矩形（R）"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="1.5"/></svg></button>
          <button class="icon-btn" data-tool="ellipse" data-tip="圆形" data-key="O" aria-label="圆形（O）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
          <button class="icon-btn" data-tool="diamond" data-tip="菱形" data-key="D" aria-label="菱形（D）"><svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg></button>
          <button class="icon-btn" data-tool="frame" data-tip="画框：把内容框在一起" data-key="A" aria-label="画框（A）"><svg viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/></svg></button>
          <span class="sep"></span>
          <button class="icon-btn" data-tool="arrow" data-tip="箭头连线" data-key="L" aria-label="箭头连线（L）"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
          <button class="icon-btn" data-tool="comment" data-tip="备注评论" data-key="C" aria-label="备注评论（C）"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/><path d="M12 8.5v6M9 11.5h6"/></svg></button>
          <span class="sep"></span>
          <button class="icon-btn" data-action="templates" data-tip="模板" data-key="" aria-label="插入模板"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 14v6M14 17h6"/></svg></button>
        </div>
        <div class="tool-hint" id="toolHint" hidden></div>
        <div class="size-tip" id="sizeTip" hidden></div>
        <div class="fmt-bar" id="fmtBar" role="toolbar" aria-label="格式" hidden></div>
        <div class="comment-thread-pop" id="commentThreadPop" role="dialog" aria-label="备注详情" hidden></div>
        <div class="canvas-tools" role="toolbar" aria-label="画布工具">
          <button class="icon-btn" data-action="zoom-out" aria-label="缩小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button class="zoom-label" data-action="zoom-reset" id="zoomLabel" title="重置为 100%">100%</button>
          <button class="icon-btn" data-action="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <span class="sep"></span>
          <button class="icon-btn" data-action="zoom-fit" aria-label="显示全部" title="显示全部：缩放到能看见画布上所有内容（Shift+1）"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button class="icon-btn" data-action="auto-align" aria-label="自动对齐" title="自动对齐：保持当前布局结构，自动吸附对齐相近的行列、等宽与等距"><svg viewBox="0 0 24 24"><path d="M4 4v16M8 7h12v4H8zM8 14h8v4H8z"/></svg></button>
          <button class="icon-btn" data-action="tidy" aria-label="整理排列" title="整理排列：把文件卡片排成整齐的网格；先框选多个形状再点，则整理这些形状"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
          <span class="sep"></span>
          <button class="icon-btn canvas-max-btn" data-action="canvas-max" aria-pressed="false" aria-label="最大化工作区（F）" title="最大化工作空间：隐藏顶栏，保留右侧功能区（快捷键 F）"><svg class="ico-max" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><svg class="ico-min" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
          <button class="icon-btn" data-action="canvas-bg" aria-label="画布背景" aria-haspopup="menu" title="画布背景：点阵 / 方格 / 纯色"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></button>
          <button class="icon-btn" data-action="shortcuts" aria-label="快捷键速查" title="快捷键速查（?）"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
        </div>
      </div>
    </section>

    <section class="archive-view" id="archiveView" aria-label="已完成项目" hidden></section>

    <section class="archive-view works-view" id="worksView" aria-label="作品" hidden></section>

    <section class="archive-view store-view" id="storeView" aria-label="云仓库" hidden></section>

    <aside class="drafts" id="drafts" aria-label="功能区">
      <div class="drafts-resizer" id="draftsResizer" role="separator" aria-orientation="vertical" aria-label="拖动调整功能区宽度，双击收起" title="拖动调整宽度 · 双击收起 / 展开"></div>
      <!-- 收起后的窄侧栏：每个功能区一个图标 + 数量，点一下展开到那个区；拖文件上来可直接放入 -->
      <nav class="drafts-rail" id="draftsRail" aria-label="功能区（已收起）"></nav>
      <div class="drafts-main" id="draftsMain">
        <div class="drafts-head">
          <div class="zone-tabs" id="zoneTabs" role="tablist"></div>
          <button class="icon-btn add-zone-btn" type="button" data-action="add-zone" title="新建功能区" aria-label="新建功能区">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-btn close-drafts" type="button" data-action="toggle-drafts" aria-label="关闭功能区">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="zone-bar">
          <p class="drafts-desc" id="draftsDesc"></p>
          <button class="icon-btn" data-action="zone-menu" id="zoneMenuBtn" aria-label="功能区设置" aria-haspopup="menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
          <button class="icon-btn collapse-drafts" data-action="collapse-drafts" aria-label="收起功能区" title="收起功能区（Ctrl+\）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6l6 6-6 6M6 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="list" id="draftsList"></div>
        <div class="drafts-foot" id="draftsFoot"></div>
      </div>
    </aside>
  </main>

  <div class="drop-overlay" id="dropOverlay" aria-hidden="true"><div>松开鼠标，文件将添加到这里</div></div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="modal" id="modal"><form method="dialog" class="modal-inner" id="modalInner"></form></dialog>
  <dialog class="modal viewer" id="viewer"><div class="modal-inner" id="viewerInner"></div></dialog>

  <input type="file" id="fileInput" multiple hidden>
  <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
  <input type="file" id="restoreInput" accept=".wbk" hidden>
  <noscript>此工作台需要启用 JavaScript。</noscript>
  <script type="module" src="app.js?v=84"></script>
</body>
</html>
