<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>方寸 · 工作台</title>
  <meta name="description" content="方寸 —— 方寸之间，万物归位。看板 + 无限画布 + 功能区的文件工作台：任意文件拖入拖出，智能关联，长按打包归档。">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="brand/mark.svg">
  <link rel="apple-touch-icon" href="brand/fangcun-logo.png">
  <script>
    // 尽早应用主题，避免刷新时闪一下
    try { var t = JSON.parse(localStorage.getItem('wb:theme') || '"auto"'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css?v=23">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" title="方寸 —— 方寸之间，万物归位">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path class="ink" d="M10 18a6 6 0 0 1 6-6h18v18h18v18a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6z"/>
        <rect class="cun" x="38" y="4" width="18" height="18" rx="3.5"/>
      </svg>
      <svg class="wordmark" viewBox="0 0 224 100" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter">
          <path d="M50 4v15"/><path d="M6 27h88"/><path d="M40 27v26c0 22-10 34-30 41"/><path d="M40 53h40v34c0 5-3 8-8 8h-9"/>
          <path d="M124 35h96"/><path d="M190 4v84c0 5-3 8-8 8h-12"/>
        </g>
        <rect class="cun" x="138" y="52" width="20" height="20" rx="4"/>
      </svg>
      <span class="brand-sub">工作台</span>
      <h1 class="sr-only">方寸 · 工作台</h1>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索文件和便签…  Ctrl+K" autocomplete="off" aria-label="搜索">
    </label>
    <div class="actions">
      <button class="btn" data-action="add-files" title="选择文件添加到当前页面">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>添加文件</span>
      </button>
      <button class="btn" data-action="new-note" title="新建便签">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg><span>便签</span>
      </button>
      <button class="btn" data-action="backup" title="导出完整备份（含所有文件）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4"/><path d="M5 19h14"/></svg><span>备份</span>
      </button>
      <button class="btn ghost" data-action="restore" title="从备份恢复">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V8m0 0-4 4m4-4 4 4"/><path d="M5 5h14"/></svg><span>恢复</span>
      </button>
      <button class="btn ghost theme-btn" data-action="toggle-theme" id="themeBtn" title="切换白天 / 黑夜（右键：跟随系统）" aria-label="切换白天 / 黑夜模式">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn ghost drafts-toggle" data-action="toggle-drafts" aria-controls="drafts" aria-expanded="false" title="功能区">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/></svg><span>功能区</span><b class="badge" id="zonesBadge">0</b>
      </button>
    </div>
  </header>

  <nav class="viewbar" aria-label="页面">
    <div class="views" id="views" role="tablist"></div>
    <div class="status">
      <button class="assoc-chip" data-action="assoc-panel" id="assocChip">智能关联</button>
      <button class="status-chip" data-action="storage-info" id="storageChip">正在检查存储…</button>
      <button class="status-chip" data-action="backup" id="backupChip">尚未备份</button>
    </div>
  </nav>

  <main class="layout">
    <section class="board" id="board" aria-label="看板"></section>

    <section class="canvas-view" id="canvasView" aria-label="画布" hidden>
      <div class="viewport" id="viewport" tabindex="-1">
        <div class="world" id="world"></div>
        <div class="canvas-empty" id="canvasEmpty">
          <b>无限画布</b>
          <span>把文件拖进来，随意摆放 · 双击空白处新建便签<br>拖动空白处平移 · Ctrl + 滚轮缩放</span>
        </div>
      </div>
      <div class="canvas-tools" role="toolbar" aria-label="画布工具">
        <button class="icon-btn" data-action="zoom-out" aria-label="缩小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button class="zoom-label" data-action="zoom-reset" id="zoomLabel" title="重置为 100%">100%</button>
        <button class="icon-btn" data-action="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <span class="sep"></span>
        <button class="icon-btn" data-action="zoom-fit" aria-label="显示全部" title="显示全部"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="icon-btn" data-action="tidy" aria-label="整理排列" title="整理排列"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
      </div>
    </section>

    <section class="archive-view" id="archiveView" aria-label="已完成项目" hidden></section>

    <section class="archive-view works-view" id="worksView" aria-label="作品" hidden></section>

    <aside class="drafts" id="drafts" aria-label="功能区">
      <div class="drafts-head">
        <div class="zone-tabs" id="zoneTabs" role="tablist"></div>
        <button class="icon-btn close-drafts" data-action="toggle-drafts" aria-label="关闭功能区">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="zone-bar">
        <p class="drafts-desc" id="draftsDesc"></p>
        <button class="icon-btn" data-action="zone-menu" id="zoneMenuBtn" aria-label="功能区设置" aria-haspopup="menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>
      <div class="list" id="draftsList"></div>
      <div class="drafts-foot" id="draftsFoot"></div>
    </aside>
  </main>

  <div class="drop-overlay" id="dropOverlay" aria-hidden="true"><div>松开鼠标，文件将添加到这里</div></div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="modal" id="modal"><form method="dialog" class="modal-inner" id="modalInner"></form></dialog>
  <dialog class="modal viewer" id="viewer"><div class="modal-inner" id="viewerInner"></div></dialog>

  <input type="file" id="fileInput" multiple hidden>
  <input type="file" id="restoreInput" accept=".wbk" hidden>
  <noscript>此工作台需要启用 JavaScript。</noscript>
  <script type="module" src="app.js?v=23"></script>
</body>
</html>
